services:
  aihub:
    build:
      context: .
      dockerfile: Dockerfile

      # 질의 생성기(질문 → SQL)의 소스는 별도 저장소에 있다.
      # 이미지 안에 함께 굽되(컨테이너는 하나), 저장소는 합치지 않는다.
      # git URL 이나 이미 빌드된 이미지도 쓸 수 있다:
      #   akita: https://github.com/<org>/akita_schema.git#main
      #   akita: docker-image://akita-query:1.0.0
      additional_contexts:
        akita: ../akita_schema
    image: aihub:latest
    container_name: aihub
    restart: unless-stopped

    # PID 1 좀비 프로세스 방지 — 질의마다 자식 프로세스를 띄우므로 필요하다.
    init: true

    ports:
      - '${PORT:-3000}:3000'

    # 모든 설정은 .env 로 주입한다 (.env.example 참고).
    env_file:
      - .env
    environment:
      PORT: 3000
      APPS_CONFIG_PATH: /app/config/apps.json

    # 앱 정의는 이미지 재빌드 없이 바꿀 수 있도록 마운트한다.
    # 수정 후 POST /api/apps/reload 로 반영.
    volumes:
      - ./config:/app/config:ro

      # ── Client VPN 을 쓸 때만 (VPC 밖에 띄우는 경우) ───────────────
      # akita 저장소에서 `make prod-ovpn` 으로 만든 .ovpn 을 ./config/ 에 두고
      # .env 에 VPN_OVPN_CONFIG=/app/config/production.ovpn 을 적습니다.
      # 위 마운트로 이미 들어가므로 볼륨을 더 추가할 필요가 없습니다.
      # 파일이 없으면 VPN 기능만 꺼진 채로 나머지가 그대로 동작합니다.

    # ── Client VPN 용 권한 ──────────────────────────────────────────
    # 컨테이너 안에서 openvpn 이 터널을 세우려면 이 셋이 필요합니다. 이 저장소는
    # VPC 밖 배포를 기본으로 보므로 켠 채로 둡니다.
    #
    # ⚠️ user: root 는 게이트웨이 프로세스도 root 로 만듭니다. openvpn 이 tun
    #    장치와 라우팅 테이블을 건드려야 해서 필요합니다.
    #
    # VPC 안에 띄워 VPN 이 필요 없다면 이 셋을 주석 처리하세요 — 그러면 USER node
    # 그대로 돌고, VPN 기능만 꺼진 채 나머지는 그대로 동작합니다.
    #
    # ECS 로 옮길 때는 EC2 시작 유형이어야 합니다. Fargate 는 devices 를 지원하지
    # 않고 capabilities.add 도 SYS_PTRACE 만 허용합니다 (README 참고).
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    user: root

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
