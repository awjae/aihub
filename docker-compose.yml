services:
  aihub:
    build:
      context: .
      dockerfile: Dockerfile
    image: aihub:latest
    container_name: aihub
    restart: unless-stopped

    # PID 1 좀비 프로세스 방지 — stdio MCP 서버를 띄울 때 필요하다.
    init: true

    ports:
      - '${PORT:-3000}:3000'

    # 모든 설정은 .env 로 주입한다 (.env.example 참고).
    env_file:
      - .env
    environment:
      PORT: 3000
      APPS_CONFIG_PATH: /app/config/apps.json
      MCP_CONFIG_PATH: /app/config/mcp.json

    # 앱/MCP 정의는 이미지 재빌드 없이 바꿀 수 있도록 마운트한다.
    # 수정 후 POST /api/apps/reload 로 반영.
    volumes:
      - ./config:/app/config:ro

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
