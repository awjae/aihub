services:
  aihub:
    build:
      context: .
      dockerfile: Dockerfile
    image: aihub:latest
    container_name: aihub
    restart: unless-stopped

    # PID 1 좀비 프로세스 방지 — stdio MCP 서버를 띄울 때 필요하다.
    init: true

    ports:
      - '${PORT:-3000}:3000'

    # 모든 설정은 .env 로 주입한다 (.env.example 참고).
    env_file:
      - .env
    environment:
      PORT: 3000
      APPS_CONFIG_PATH: /app/config/apps.json
      MCP_CONFIG_PATH: /app/config/mcp.json

    # 앱/MCP 정의는 이미지 재빌드 없이 바꿀 수 있도록 마운트한다.
    # 수정 후 POST /api/apps/reload 로 반영.
    volumes:
      - ./config:/app/config:ro

      # ── Client VPN 을 쓸 때만 (VPC 밖에 띄우는 경우) ───────────────
      # akita 저장소에서 `make prod-ovpn` 으로 만든 .ovpn 을 ./config/ 에 두고
      # .env 에 VPN_OVPN_CONFIG=/app/config/production.ovpn 을 적습니다.
      # 위 마운트로 이미 들어가므로 볼륨을 더 추가할 필요가 없습니다.
      # 파일이 없으면 VPN 기능만 꺼진 채로 나머지가 그대로 동작합니다.

    # ── Client VPN 을 쓸 때만 주석을 푸세요 ─────────────────────────
    # 컨테이너 안에서 openvpn 이 터널을 세우려면 필요합니다. VPN 을 쓰지 않으면
    # 이 셋 없이 USER node 그대로 돌아갑니다 — 기본 권한을 올리지 않기 위해
    # 옵트인으로 둡니다.
    #
    # ⚠️ user: root 는 게이트웨이 프로세스도 root 로 만듭니다. openvpn 이 tun
    #    장치와 라우팅 테이블을 건드려야 해서 필요합니다.
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun:/dev/net/tun
    # user: root

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
